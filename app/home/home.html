<div class="home">
    <div class="text-center">

        <div class="vertical-space"></div>
        
        <img src="images/TheGitDown.svg" alt="Buy Me A Coffee" style="width: 100rem !important;">
        <div class="center-row"></div>
        <h4 style="font-style: italic;">Download Any Git Directory You Like</h4>


        <div class="vertical-space"></div>
        <div class="col-md-6 center-row">
            <input name="url" type="url" placeholder="GitHub File or Directory Link" class="form-control" ng-model="url"
                ng-keypress="catchEnter($event)"></input>
        </div>
        <div class="btn-group center-row">
            <button type="button" class="btn btn-default" ng-click="createDownLink()">Create Download Link</button>
            <button type="button" class="btn btn-default" ng-click="download()">Download Directory</button>
        </div>


        <div ng-show="isProcessing.val">
            <div class="vertical-space"></div>
            <img class="processing-img" src="images/processing.gif" />
            <p>Downloaded {{downloadedFiles.val}} of {{totalFiles.val}} files</p>
        </div>


        <div class="col-md-6 center-row" ng-show="downUrl">
            <div class="vertical-space"></div>
            <textarea class="form-control download-link-box" ng-model="downUrl"></textarea>
        </div>

        <div class="vertical-space"></div>
        <div>
            <div class="footer">
                <span class="header">Contact Me</span>
                <div class="left">
                    <textarea placeholder="Name" class="name"></textarea>
                    <textarea placeholder="Email/Contact" class="email"></textarea>
                </div>
                <div class="right">
                    <textarea placeholder="Message" class="msg"></textarea>
                    <button id="submitbtn">></button>
                </div>
                <hr>
                <div class="bottom">
