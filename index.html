    <title>TheGitDown</title>
  </head>
  <body>
    <!--
      THESIS: Surgical extraction as a file-tree prune — the mechanism is the first viewport, not a slogan over a companion mascot.
      OWN-WORLD: Warm near-black panels (#0C0C0C / #141310 / #1B1A15), beige ink, terracotta #DA532C. Quicksand display, Space Mono for labels, tree, and buttons. Square 1px-bordered plates with drafting-grid ground and corner registration marks.
      STORY: Visitor sees one folder lifted from a repo, believes the zip happens in-browser, and pastes a GitHub URL.
      FIRST VIEWPORT: 1100px bordered plate with drafting-grid ground and corner registration marks. Top bar gitdown_ + // surgical repo downloads. Left: headline “Grab the branch. Skip the forest.” and lede. Right: mono tree, assets/ pulsing, assets.zip dropping. Download lives in the plate below.
      FORM: Tree Pruning (concept 1a), user-locked from design_handoff_gitdown_hero; seed 1a-tree-pruning.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
